<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christmas Countdown</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Both canvases hold their place whether or not the scene file loads:
         the scene covers the window, the countdown sits over its top strip. */
      canvas {
        position: fixed;
        top: 0;
        image-rendering: pixelated;
      }
      canvas#scene {
        /* The picture may overhang a very narrow window by a part-pixel; it
           stays centred so the countdown is centred on its strip. */
        left: 50%;
        transform: translateX(-50%);
        z-index: 0;
      }
      canvas#countdown {
        left: 50%;
        transform: translateX(-50%);
        z-index: 1;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="countdown" aria-hidden="true" hidden></canvas>
    <p id="countdown-text" class="visually-hidden"></p>
    <div id="countdown-announce" class="visually-hidden" aria-live="polite"></div>
    <noscript><span>Christmas is on 25 December</span></noscript>
    <!-- countdown-script -->
  </body>
</html>
